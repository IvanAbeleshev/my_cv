services:
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_GOOGLE_RECAPTURE=${NEXT_PUBLIC_GOOGLE_RECAPTURE}
    container_name: nextjs
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    expose:
      - "3000"
    restart: unless-stopped
    networks:
      - my_cv

  nginx:
    image: nginx:latest
    container_name: cv_nginx
    depends_on:
      - nextjs
    volumes:
      - /home/ssl_certificates/:/etc/nginx/ssl/:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    expose:
      - "80"
      - "443"
    restart: unless-stopped
    networks:
      my_cv:
        aliases:
          - cv_nginx

networks:
  my_cv:
    name: my_cv
    external: true
